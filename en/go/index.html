<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get Schedio — Schedio</title>
    <meta name="description" content="We send you to the right Schedio for your phone: Google Play on Android, the install guide on iPhone." />
    <!-- Short link for the home page QR, Instagram bio and stories. Not meant
         for search engines: the real page is the home. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://schedio.es/en/" />
    <meta name="theme-color" content="#0f0f0f" />

    <link rel="icon" href="../../assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png" />
    <link rel="preload" href="../../assets/fonts/bebas-neue-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../../assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../../css/tokens.css?v=27" />
    <link rel="stylesheet" href="../../css/styles.css?v=27" />
  </head>

  <body>
    <header class="nav" id="nav">
      <div class="wrap nav__inner">
        <a class="brand" href="/en/">
          <img src="../../assets/mark-96.png" alt="" width="30" height="30" />
          Schedio
        </a>
        <div class="nav__actions">
          <a class="lang-switch" href="/go" hreflang="es" lang="es">ES</a>
        </div>
      </div>
    </header>

    <main class="go wrap">
      <h1 class="display">Get Schedio</h1>
      <p class="lede" id="goStatus">Pick how you want to use it.</p>

      <!-- With JS, on Android and iPhone the script jumps to the destination by
           itself. Without JS (or on a computer) this is all there is, and it's
           enough. -->
      <div class="closer__cta">
        <a class="badge-playstore" href="https://play.google.com/store/apps/details?id=com.schedio.mobile&amp;pcampaignid=web_share&amp;referrer=utm_source%3Dschedio.es%26utm_medium%3Dweb%26utm_campaign%3Dgo" target="_blank" rel="noopener">
          <img src="../../assets/google-play-badge-en.png" alt="Get it on Google Play" width="168" height="50" />
        </a>
        <a class="btn btn--primary" href="/en/iphone">Download for iPhone</a>
        <a class="desk-link has-arrow" href="https://app.schedio.es/">Or use it right now in your browser</a>
      </div>
    </main>

    <script>
      (function () {
        var ua = navigator.userAgent;
        var status = document.getElementById('goStatus');
        // iPadOS reports itself as a Mac, but with a touch screen.
        var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        var android = /Android/.test(ua);
        if (!ios && !android) return;
        status.textContent = ios ? 'Taking you to the iPhone guide…' : 'Taking you to Google Play…';
        // Un instante de margen: si saltara al momento, la visita a /go se iría sin contarse.
        var target =
          ios ? '/en/iphone' : 'https://play.google.com/store/apps/details?id=com.schedio.mobile&pcampaignid=web_share&referrer=utm_source%3Dschedio.es%26utm_medium%3Dweb%26utm_campaign%3Dgo';
        setTimeout(function () {
          window.location.replace(target);
        }, 900);
      })();
    </script>
    <!-- Cloudflare Web Analytics -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "354afdfa66624a93a8ae896f761e8f17"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
